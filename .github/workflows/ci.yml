name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exam:
    runs-on: ubuntu-latest
    env:
      BASE_URL: http://127.0.0.1:3000
      MONGODB_URI: "mongodb://127.0.0.1:27017/exam_system?replicaSet=rs0&directConnection=true"
      PORT: 3000
      UNIVAI_AGENT_SECRET: ${{ github.sha }}
    steps:
      - name: Check out Exam only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Start MongoDB replica set
        shell: bash
        run: |
          docker run --detach --name univai-ci-mongo --network host mongo:7 mongod --replSet rs0 --bind_ip_all
          for attempt in {1..30}; do
            if docker exec univai-ci-mongo mongosh --quiet --eval "db.runCommand({ ping: 1 }).ok" | grep -q '^1$'; then
              break
            fi
            sleep 1
          done
          docker exec univai-ci-mongo mongosh --quiet --eval "rs.initiate()"
          for attempt in {1..30}; do
            if docker exec univai-ci-mongo mongosh --quiet --eval "db.hello().isWritablePrimary" | grep -qi '^true$'; then
              break
            fi
            sleep 1
          done
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Start Exam service
        run: npm run start > "$RUNNER_TEMP/exam-server.log" 2>&1 &
      - name: Run API integration tests
        run: node api_test.mjs
      - name: Run unit tests
        run: npx vitest run tests/api tests/lib tests/ci
      - name: Check whitespace
        run: git diff --check
